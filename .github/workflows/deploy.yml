name: Deploy Quartz site

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "site/**"
      - "memory/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # Weekly redeploy every Sunday at 03:17 UTC — keeps site fresh even without wiki changes
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout wiki
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate wiki catalog and lint gates
        run: |
          python scripts/wiki-catalog.py --root .
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from wiki_core import lint_wiki

          report = lint_wiki(Path(".").resolve())
          fatal_keys = [
              "broken_links",
              "ambiguous_links",
              "missing_from_index",
              "private_leaks",
          ]
          failed = False
          for key in fatal_keys:
              items = report.get(key, [])
              if items:
                  failed = True
                  print(f"::error title={key}::{len(items)} issue(s)")
                  for item in items:
                      print(f"- {item}")
          if report.get("catalog_status") != "fresh":
              failed = True
              print(f"::error title=catalog_status::{report.get('catalog_status')}")
          if failed:
              raise SystemExit(1)
          print("Wiki validation passed.")
          PY

      - name: Checkout Quartz
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jackyzha0/quartz
          # Pinned to a verified-good commit so upstream v4 drift cannot break deploys.
          # Bump deliberately after testing build-site.ps1 locally.
          ref: d25a6eabf96751ffca56f8a8139272def7a65041
          path: .quartz-build
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .quartz-build/package-lock.json

      - name: Install Quartz dependencies
        run: npm ci
        working-directory: .quartz-build

      - name: Sync public wiki content
        run: node site/sync-content.mjs .quartz-build/content

      - name: Apply site configuration
        run: |
          cp site/quartz.config.ts .quartz-build/quartz.config.ts
          cp site/quartz.layout.ts .quartz-build/quartz.layout.ts
          cp site/custom.scss .quartz-build/quartz/styles/custom.scss

      - name: Resolve GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build Quartz
        run: npx quartz build -d content -o public
        working-directory: .quartz-build
        env:
          QUARTZ_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Verify Quartz artifact
        run: |
          test -f .quartz-build/public/index.html
          grep -q 'id="quartz-root"' .quartz-build/public/index.html
          grep -q 'Command Center' .quartz-build/public/index.html
          if grep -q 'Operating Contract' .quartz-build/public/index.html; then
            echo "Built artifact looks like the repository README, not the Quartz wiki home." >&2
            exit 1
          fi

      - name: Check public/private boundary
        run: |
          if grep -R -n -E "wiki-private|raw/private" .quartz-build/public; then
            echo "Public site contains private/raw path references." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .quartz-build/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify deployed site
        run: |
          set -u

          url="${{ steps.deployment.outputs.page_url }}"
          last_status="not requested"
          last_url="${url}"
          for i in {1..12}; do
            if response="$(curl --location --silent --show-error \
              --connect-timeout 5 --max-time 20 \
              --output /tmp/site.html \
              --write-out '%{http_code}\t%{url_effective}' \
              "${url}?deploy-check=${GITHUB_RUN_ID}-${i}")"; then
              IFS=$'\t' read -r last_status last_url <<< "${response}"
              if [[ "${last_status}" == "200" ]] \
                && grep -Fq 'id="quartz-root"' /tmp/site.html \
                && grep -Fq 'Command Center' /tmp/site.html; then
                echo "Verified Quartz wiki home at ${last_url}"
                exit 0
              fi
            else
              last_status="transport error"
            fi
            echo "Deployment not ready (attempt ${i}/12, status: ${last_status}, URL: ${last_url})."
            sleep 10
          done
          echo "Deployed site did not serve the Quartz wiki home (last status: ${last_status}, URL: ${last_url})." >&2
          echo "First headings seen:" >&2
          grep -oE '<h[12][^>]*>[^<]+' /tmp/site.html | head -10 >&2 || true
          exit 1
